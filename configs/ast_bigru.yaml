model:
  name: "AST_BiGRU"
  backend: "ast"
  ast_backbone: "MIT/ast-finetuned-audioset-10-10-0.4593"
  frozen_backbone: true
  in_dim: 768
  gru_hidden: 128
  dropout: 0.3
  trainable_parameters: 310614

training:
  epochs: 30
  batch_size: 32
  learning_rate: 0.001
  pos_weight: 4.0
  patience: 10
  seed: 42

audio:
  sample_rate: 16000
  duration_sec: 10.0
  step_sec: 0.1
  t_steps: 100
